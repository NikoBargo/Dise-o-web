<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etiquetas</title>
</head>
<body>
    <h1>Esto es una etiqueta h1</h1>
    <p>Esto es una etiqueta p</p>
    <a href="https://www.google.com">Esto es una etiqueta a</a>
    <div>
        <br>
    <img src="https://static.vecteezy.com/system/resources/thumbnails/060/843/811/small/close-up-of-raindrops-on-leaves-hd-background-luxury-hd-wallpaper-image-trendy-background-illustration-free-photo.jpg " alt="Etiqueta img">
    <p>arriba se usa la etiqueta img</p>
    <h1>Aqui se usa un <br> salto de linea con etiqueta br</h1>
    <ul><li>Pan</li><li>Leche</li>Esto es una lista sin orden con ul</ul>
    <ol type="A"><li>Uno</li><li>Dos</li>Esto es una lista con orden con ol</ol>
    <table border="1"><tr><td>Esto es una tabla con table</td></tr></table>
    <br>
    <form action="/enviar-datos" method="POST">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" required>

        <button type="submit">Envia tu formulario</button>
    </form>
    <input type="text" name="nombre" placeholder="Aqui se usa la etiqueta input">
    <br>
    <button type="button">Aqui se usa button</button>
